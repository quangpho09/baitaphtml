<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Dashboard</title>
</head>
<body>
<div class="position-fixed bg-dark text-white vh-100 p-3" style="width:220px">
<h4>Admin</h4>
<div class="list-group">
<a class="list-group-item">Dashboard</a>
<a class="list-group-item">Orders</a>
<a class="list-group-item">Users</a>
</div>
</div>

<div style="margin-left:240px" class="p-3">
<nav class="d-flex justify-content-between">
<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item">Home</li></ol></nav>
<div class="dropdown"><button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">User</button></div>
</nav>

<div class="row g-3">
<div class="col-md-3"><div class="card bg-primary text-white"><div class="card-body">100</div></div></div>
<div class="col-md-3"><div class="card bg-success text-white"><div class="card-body">200</div></div></div>
<div class="col-md-3"><div class="card bg-warning"><div class="card-body">300</div></div></div>
<div class="col-md-3"><div class="card bg-danger text-white"><div class="card-body">400</div></div></div>
</div>

<div class="alert alert-success mt-3">Thành công</div>

<table class="table table-striped table-hover mt-3">
<tr><th>ID</th><th>Khách</th><th>Trạng thái</th></tr>
<tr><td>1</td><td>A</td><td>Done</td></tr>
<tr><td>2</td><td>B</td><td>Pending</td></tr>
</table>

<div class="input-group mb-3">
<input class="form-control" placeholder="Search">
<button class="btn btn-primary">Tìm</button>
</div>

<div class="accordion" id="faq">
<div class="accordion-item">
<h2 class="accordion-header"><button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#c1">FAQ</button></h2>
<div id="c1" class="accordion-collapse collapse show"><div class="accordion-body">Nội dung FAQ</div></div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
