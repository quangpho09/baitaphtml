<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Công Việc</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>📋 QUẢN LÝ CÔNG VIỆC</h1>
        <h2>Task Dashboard</h2>
    </div>

    <!-- BUTTON -->
    <div class="top-bar">
        <button class="btn btn-primary" id="openModalBtn">
            + Thêm Công Việc
        </button>
    </div>

    <!-- THỐNG KÊ -->
    <div class="stats">

        <div class="card blue">
            <h3>Tổng Công Việc</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="card green">
            <h3>Đã Hoàn Thành</h3>
            <p id="completedTasks">0</p>
        </div>

        <div class="card orange">
            <h3>Chưa Hoàn Thành</h3>
            <p id="pendingTasks">0</p>
        </div>

    </div>

    <!-- THÔNG BÁO -->
    <div id="messageBox"></div>

    <!-- DANH SÁCH -->
    <div id="taskContainer"></div>

</div>

<!-- MODAL -->
<div class="modal hidden" id="taskModal">

    <div class="modal-content">

        <div class="modal-header">
            <h2 id="modalTitle">Thêm Công Việc</h2>

            <button class="btn btn-danger"
                id="closeModalBtn">
                X
            </button>
        </div>

        <!-- FORM -->
        <form id="taskForm">

            <!-- TIÊU ĐỀ -->
            <input
                type="text"
                id="title"
                placeholder="Nhập tiêu đề công việc"
                required
            >

            <!-- MÔ TẢ -->
            <textarea
                id="description"
                placeholder="Nhập mô tả ngắn">
            </textarea>

            <!-- DEADLINE -->
            <input
                type="date"
                id="deadline"
            >

            <!-- PRIORITY -->
            <select id="priority">

                <option value="Thấp">
                    Thấp
                </option>

                <option value="Trung Bình">
                    Trung Bình
                </option>

                <option value="Cao">
                    Cao
                </option>

            </select>

            <!-- TRẠNG THÁI -->
            <label>

                <input
                    type="checkbox"
                    id="completed"
                >

                Hoàn Thành

            </label>

            <!-- BUTTON -->
            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn btn-primary">
                    Lưu
                </button>

                <button
                    type="button"
                    class="btn btn-danger"
                    id="cancelBtn">
                    Hủy
                </button>

            </div>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
