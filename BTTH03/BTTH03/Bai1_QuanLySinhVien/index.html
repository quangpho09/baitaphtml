
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Sinh Viên</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="header">
    <h1>🎓 QUẢN LÝ SINH VIÊN</h1>
    <h2>Dashboard</h2>
</div>

<div class="top-bar">
    <button class="btn btn-primary" id="openModalBtn">
        + Thêm Sinh Viên
    </button>
</div>

<div class="stats">

    <div class="card blue">
        <h3>Tổng Sinh Viên</h3>
        <p id="totalStudents">0</p>
    </div>

    <div class="card green">
        <h3>Điểm Trung Bình</h3>
        <p id="averageScore">0</p>
    </div>

</div>

<div id="messageBox"></div>

<table>
    <thead>
        <tr>
            <th>Mã SV</th>
            <th>Họ Tên</th>
            <th>Ngày Sinh</th>
            <th>Lớp</th>
            <th>Điểm</th>
            <th>Email</th>
            <th>Hành Động</th>
        </tr>
    </thead>

    <tbody id="studentTableBody"></tbody>
</table>

</div>

<div class="modal hidden" id="studentModal">

<div class="modal-content">

<div class="modal-header">
    <h2 id="modalTitle">Thêm Sinh Viên</h2>
    <button class="btn btn-danger" id="closeModalBtn">X</button>
</div>

<form id="studentForm">

<input type="text" id="studentId" placeholder="Nhập mã sinh viên">
<small class="error" id="studentIdError"></small>

<input type="text" id="fullName" placeholder="Nhập họ tên">
<small class="error" id="fullNameError"></small>

<input type="date" id="birthDate">

<input type="text" id="className" placeholder="Nhập lớp">

<input type="number" id="score" placeholder="Nhập điểm">

<input type="email" id="email" placeholder="Nhập email">

<div class="form-buttons">
<button type="submit" class="btn btn-primary">Lưu</button>
<button type="button" class="btn btn-danger" id="cancelBtn">Hủy</button>
</div>

</form>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
