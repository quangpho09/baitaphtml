<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👥 User Directory</h1>
            <p>Quản lý danh sách người dùng</p>
        </header>

        <!-- Search bar -->
        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Tìm kiếm theo tên hoặc email..."
                class="search-input"
            >
            <button id="addUserBtn" class="btn btn-primary">➕ Thêm người dùng mới</button>
        </div>

        <!-- Loading state -->
        <div id="loadingState" class="state">
            <div class="skeleton-loader">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>
        </div>

        <!-- Users table -->
        <div id="usersList" class="state hidden">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên</th>
                        <th>Email</th>
                        <th>Điện thoại</th>
                        <th>Thành phố</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Generated by JS -->
                </tbody>
            </table>
        </div>

        <!-- Error state -->
        <div id="errorState" class="state hidden">
            <div class="error-box">
                <p>❌ <span id="errorMessage"></span></p>
            </div>
        </div>
    </div>

    <!-- Modal for Create/Edit user -->
    <div id="userModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Thêm người dùng mới</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>

            <form id="userForm" class="user-form">
                <input type="hidden" id="userId" value="">

                <div class="form-group">
                    <label for="userName">Tên *</label>
                    <input type="text" id="userName" required>
                </div>

                <div class="form-group">
                    <label for="userEmail">Email *</label>
                    <input type="email" id="userEmail" required>
                </div>

                <div class="form-group">
                    <label for="userPhone">Điện thoại</label>
                    <input type="tel" id="userPhone">
                </div>

                <div class="form-group">
                    <label for="userCity">Thành phố</label>
                    <input type="text" id="userCity">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">💾 Lưu</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
