<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-API Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Multi-API Dashboard</h1>
            <p id="loadTime" class="load-time">Chưa load</p>
            <button id="refreshBtn" class="btn btn-refresh">🔄 Tải lại tất cả</button>
        </header>

        <!-- Main dashboard grid -->
        <div class="dashboard-grid">
            <!-- Widget 1: Users -->
            <div id="usersWidget" class="widget">
                <div class="widget-header">
                    <h2>👥 Người dùng</h2>
                    <div class="widget-status"></div>
                </div>
                <div class="widget-content">
                    <div class="skeleton"></div>
                </div>
                <div class="widget-error hidden">
                    <p>❌ <span class="error-text"></span></p>
                </div>
            </div>

            <!-- Widget 2: Posts -->
            <div id="postsWidget" class="widget">
                <div class="widget-header">
                    <h2>📝 Bài viết</h2>
                    <div class="widget-status"></div>
                </div>
                <div class="widget-content">
                    <div class="skeleton"></div>
                </div>
                <div class="widget-error hidden">
                    <p>❌ <span class="error-text"></span></p>
                </div>
            </div>

            <!-- Widget 3: Weather -->
            <div id="weatherWidget" class="widget">
                <div class="widget-header">
                    <h2>🌤️ Thời tiết</h2>
                    <div class="widget-status"></div>
                </div>
                <div class="widget-content">
                    <div class="skeleton"></div>
                </div>
                <div class="widget-error hidden">
                    <p>❌ <span class="error-text"></span></p>
                </div>
            </div>

            <!-- Widget 4: Countries -->
            <div id="countriesWidget" class="widget">
                <div class="widget-header">
                    <h2>🌍 Quốc gia</h2>
                    <div class="widget-status"></div>
                </div>
                <div class="widget-content">
                    <div class="skeleton"></div>
                </div>
                <div class="widget-error hidden">
                    <p>❌ <span class="error-text"></span></p>
                </div>
            </div>

            <!-- Widget 5: Random Users -->
            <div id="randomUsersWidget" class="widget">
                <div class="widget-header">
                    <h2>🎲 Random Users</h2>
                    <div class="widget-status"></div>
                </div>
                <div class="widget-content">
                    <div class="skeleton"></div>
                </div>
                <div class="widget-error hidden">
                    <p>❌ <span class="error-text"></span></p>
                </div>
            </div>

            <!-- Widget 6: Dogs -->
            <div id="dogsWidget" class="widget">
                <div class="widget-header">
                    <h2>🐕 Hình ảnh chó</h2>
                    <div class="widget-status"></div>
                </div>
                <div class="widget-content">
                    <div class="skeleton"></div>
                </div>
                <div class="widget-error hidden">
                    <p>❌ <span class="error-text"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
