<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - DOM Manipulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">🛍️ Product Store</h1>
            
            <!-- Dark Mode Toggle -->
            <button id="darkModeBtn" class="dark-mode-toggle" title="Toggle dark mode">
                🌙 Dark Mode
            </button>
        </div>
    </header>

    <!-- Cart Badge -->
    <div class="cart-badge">
        <span id="cartCount">0</span>
    </div>

    <main class="container">
        <!-- Search Section -->
        <section class="search-section">
            <input 
                id="searchInput" 
                type="text" 
                class="search-input" 
                placeholder="Tìm kiếm sản phẩm..."
            >
        </section>

        <!-- Controls -->
        <section class="controls">
            <!-- Category Filter -->
            <div class="filter-group">
                <h3>Danh mục:</h3>
                <div id="categoryFilter" class="category-buttons">
                    <!-- Generated by JS -->
                </div>
            </div>

            <!-- Sort -->
            <div class="sort-group">
                <label for="sortSelect">Sắp xếp:</label>
                <select id="sortSelect" class="sort-select">
                    <option value="default">Mặc định</option>
                    <option value="price-asc">Giá: Thấp → Cao</option>
                    <option value="price-desc">Giá: Cao → Thấp</option>
                    <option value="name-asc">Tên: A → Z</option>
                    <option value="rating-desc">Đánh giá: Cao nhất</option>
                </select>
            </div>
        </section>

        <!-- Products Grid -->
        <section class="products-section">
            <div id="productsGrid" class="products-grid">
                <!-- Generated by JS -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state hidden">
                <p>😢 Không tìm thấy sản phẩm nào</p>
            </div>
        </section>
    </main>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close">✕</button>
            <div id="modalBody" class="modal-body">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification hidden">
        <span id="notificationText"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
