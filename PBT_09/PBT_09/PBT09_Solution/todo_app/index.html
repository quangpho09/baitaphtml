<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - DOM Manipulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <header>
                <h1>📝 My Todo App</h1>
                <p class="subtitle">Quản lý công việc hàng ngày</p>
            </header>

            <main>
                <!-- Input Form -->
                <div class="input-section">
                    <form id="todoForm">
                        <input 
                            id="todoInput" 
                            type="text" 
                            placeholder="Thêm công việc mới..."
                            autocomplete="off"
                        >
                        <button type="submit" class="btn btn-add">➕ Thêm</button>
                    </form>
                </div>

                <!-- Filter Buttons -->
                <div class="filter-section">
                    <button class="filter-btn active" data-filter="all">
                        📋 Tất cả
                    </button>
                    <button class="filter-btn" data-filter="active">
                        ⏳ Chưa làm
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        ✅ Đã hoàn thành
                    </button>
                </div>

                <!-- Stats -->
                <div class="stats">
                    <span id="itemsLeft">0 items left</span>
                    <button id="clearCompleted" class="btn btn-clear">🗑️ Xóa đã làm</button>
                </div>

                <!-- Todo List -->
                <ul id="todoList" class="todo-list">
                    <!-- Items will be added here by JavaScript -->
                </ul>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state">
                    <p>🎉 Không có công việc nào! Tạo một cái mới đi.</p>
                </div>
            </main>

            <footer>
                <p>💾 Dữ liệu được lưu tự động vào LocalStorage</p>
            </footer>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
