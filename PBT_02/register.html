<!DOCTYPE html>
<html>
<body>
<form action="#" method="POST">
<fieldset>
<legend>Thông tin cá nhân</legend>
<label>Họ tên</label><input type="text" required minlength="2" maxlength="50" placeholder="Tên">
<label>Email</label><input type="email" required placeholder="Email">
<label>Phone</label><input type="tel" pattern="[0-9]{10}" placeholder="0901234567">
<label>Ngày sinh</label><input type="date">
</fieldset>

<fieldset>
<legend>Tài khoản</legend>
<input type="text" placeholder="Username">
<input type="password" minlength="8" placeholder="Password">
<input type="password" placeholder="Confirm">
</fieldset>

<button type="submit">Submit</button>
</form>
</body>
</html>
