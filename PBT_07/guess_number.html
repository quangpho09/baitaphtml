<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đoán Số</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #333;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .stats {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .stats p {
            margin: 8px 0;
            color: #333;
            font-size: 14px;
        }

        .message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            min-height: 30px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 GAME ĐỐ SỐ</h1>
        <p class="subtitle">Bạn có 7 lượt để đoán số từ 1 đến 100</p>
        
        <div class="info">
            <p>Máy đã nghĩ ra một số bí mật...</p>
            <p style="font-weight: bold; margin-top: 10px;">Hãy thử đoán!</p>
        </div>

        <div id="message" class="message"></div>

        <button onclick="startGame()">🎯 Bắt đầu trò chơi</button>
        <button onclick="location.reload()">🔄 Làm lại</button>

        <div class="stats">
            <p>Lượt đoán còn lại: <strong id="attempts">7</strong></p>
            <p id="guessed-list">Các số đã đoán: <em>Chưa có</em></p>
        </div>
    </div>

    <script src="guess.js"></script>
</body>
</html>
